<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="WHAT I DO" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#12082b"/>
<stop offset="55%" stop-color="#2a1260"><animate attributeName="stop-color" values="#2a1260;#1b1048;#2a1260" dur="9s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#12082b"/>
</linearGradient>
<linearGradient id="tt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
<stop offset="0%" stop-color="#c9a0ff"/><stop offset="30%" stop-color="#ffffff"/><stop offset="60%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#c9a0ff"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
<clipPath id="rev"><rect x="0" y="0" width="0" height="140"><animate attributeName="width" from="0" to="1000" dur="1.4s" begin="0.2s" fill="freeze"/></rect></clipPath>
<clipPath id="rd"><rect width="1000" height="140" rx="16"/></clipPath>
</defs>
<g clip-path="url(#rd)">
<rect width="1000" height="140" fill="url(#bg)"/>
<ellipse cx="500" cy="70" rx="420" ry="52" fill="none" stroke="#8a2be2" stroke-opacity="0.18" stroke-dasharray="4 8"/><ellipse cx="500" cy="70" rx="300" ry="38" fill="none" stroke="#00d4ff" stroke-opacity="0.18" stroke-dasharray="4 8"/><ellipse cx="500" cy="70" rx="190" ry="26" fill="none" stroke="#8a2be2" stroke-opacity="0.18" stroke-dasharray="4 8"/><circle r="6" fill="#8a2be2" filter="url(#glow)"><animateMotion dur="14s" begin="0s" repeatCount="indefinite" path="M80 70 a420 52 0 1 0 840 0 a420 52 0 1 0 -840 0"/></circle><circle r="5" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="10s" begin="-5.0s" repeatCount="indefinite" path="M200 70 a300 38 0 1 0 600 0 a300 38 0 1 0 -600 0"/></circle><circle r="4" fill="#8a2be2" filter="url(#glow)"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M310 70 a190 26 0 1 0 380 0 a190 26 0 1 0 -380 0"/></circle><circle r="4" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="14s" begin="-7.0s" repeatCount="indefinite" path="M80 70 a420 52 0 1 0 840 0 a420 52 0 1 0 -840 0"/></circle><circle r="3" fill="#8a2be2" filter="url(#glow)"><animateMotion dur="10s" begin="0s" repeatCount="indefinite" path="M200 70 a300 38 0 1 0 600 0 a300 38 0 1 0 -600 0"/></circle>
<text x="500" y="46" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="15" letter-spacing="9" fill="#8a2be2" opacity="0.9">SECTION 03
<animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></text>
<g clip-path="url(#rev)">
<text x="500" y="98" text-anchor="middle" font-family="'Segoe UI Black','Arial Black',Impact,Helvetica,sans-serif" font-size="44" font-weight="900" letter-spacing="5" fill="url(#tt)" filter="url(#glow)">WHAT I DO</text>
