<rect x="300" y="116" width="400" height="3" rx="1.5" fill="#8a2be2" opacity="0.8"><animate attributeName="width" values="0;400;0" dur="4s" repeatCount="indefinite"/><animate attributeName="x" values="500;300;500" dur="4s" repeatCount="indefinite"/></rect>
<g stroke="#8a2be2" stroke-opacity="0.55" stroke-width="3" fill="none" stroke-linecap="round"><path d="M20 40V20H40"/><path d="M980 40V20H960"/><path d="M20 100V120H40"/><path d="M980 100V120H960"/></g>
</g>
<rect width="1000" height="140" rx="16" fill="none" stroke="#8a2be2" stroke-opacity="0.35"><animate attributeName="stroke-opacity" values="0.15;0.6;0.15" dur="4s" repeatCount="indefinite"/></rect>
