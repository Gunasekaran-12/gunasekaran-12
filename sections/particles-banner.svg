<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#1a1040">
        <animate attributeName="stop-color" values="#1a1040;#0f2a4a;#1a1040" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a2be2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="160" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="158" rx="15" fill="none" stroke="#00d4ff" stroke-opacity="0.25"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="70" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="25" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="55" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="20" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="65" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="30" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="60" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="28" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating glowing orbs -->
  <circle cx="150" cy="120" r="6" fill="#00d4ff" opacity="0.7">
    <animate attributeName="cy" values="130;40;130" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="130" r="4" fill="#8a2be2" opacity="0.7">
    <animate attributeName="cy" values="140;30;140" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="125" r="5" fill="#ff6b35" opacity="0.6">
    <animate attributeName="cy" values="135;45;135" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="120" r="6" fill="#00d4ff" opacity="0.7">
    <animate attributeName="cy" values="130;35;130" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- flowing waves -->
  <path fill="url(#wave1)" d="M0,120 C250,90 350,150 600,120 C800,95 900,140 1000,115 L1000,160 L0,160 Z">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="M0,120 C250,90 350,150 600,120 C800,95 900,140 1000,115 L1000,160 L0,160 Z;
              M0,125 C250,150 350,90 600,125 C800,150 900,100 1000,125 L1000,160 L0,160 Z;
              M0,120 C250,90 350,150 600,120 C800,95 900,140 1000,115 L1000,160 L0,160 Z"/>
  </path>
  <path fill="url(#wave2)" d="M0,135 C200,115 400,155 650,135 C800,122 900,150 1000,132 L1000,160 L0,160 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,135 C200,115 400,155 650,135 C800,122 900,150 1000,132 L1000,160 L0,160 Z;
              M0,132 C200,155 400,115 650,138 C800,155 900,120 1000,136 L1000,160 L0,160 Z;
              M0,135 C200,115 400,155 650,135 C800,122 900,150 1000,132 L1000,160 L0,160 Z"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
