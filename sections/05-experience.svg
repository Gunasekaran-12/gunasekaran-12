<clipPath id="rev"><rect x="0" y="0" width="0" height="140"><animate attributeName="width" from="0" to="1000" dur="1.4s" begin="0.2s" fill="freeze"/></rect></clipPath>
<clipPath id="rd"><rect width="1000" height="140" rx="16"/></clipPath>
</defs>
<g clip-path="url(#rd)">
<rect width="1000" height="140" fill="url(#bg)"/>
<path d="M0 30H180V70H360V30H560V100H760V60H1000" fill="none" stroke="#00d4ff" stroke-opacity="0.22" stroke-width="2"/><path d="M0 110H120V90H300V120H520V80H700V110H1000" fill="none" stroke="#00d4ff" stroke-opacity="0.22" stroke-width="2"/><path d="M0 70H80V20H260V50H460V15H640V45H860V20H1000" fill="none" stroke="#00d4ff" stroke-opacity="0.22" stroke-width="2"/><circle r="4" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M0 30H180V70H360V30H560V100H760V60H1000"/></circle><circle r="4" fill="#ff6b9d" filter="url(#glow)"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M0 30H180V70H360V30H560V100H760V60H1000"/></circle><circle r="4" fill="#ff6b9d" filter="url(#glow)"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M0 110H120V90H300V120H520V80H700V110H1000"/></circle><circle r="4" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="8s" begin="-3s" repeatCount="indefinite" path="M0 110H120V90H300V120H520V80H700V110H1000"/></circle><circle r="4" fill="#00d4ff" filter="url(#glow)"><animateMotion dur="10s" begin="0s" repeatCount="indefinite" path="M0 70H80V20H260V50H460V15H640V45H860V20H1000"/></circle><circle r="4" fill="#ff6b9d" filter="url(#glow)"><animateMotion dur="10s" begin="-3s" repeatCount="indefinite" path="M0 70H80V20H260V50H460V15H640V45H860V20H1000"/></circle><circle cx="180" cy="30" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/><circle cx="360" cy="70" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/><circle cx="560" cy="30" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/><circle cx="760" cy="100" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/><circle cx="300" cy="90" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/><circle cx="520" cy="120" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/><circle cx="260" cy="20" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/><circle cx="640" cy="15" r="4" fill="none" stroke="#ff6b9d" stroke-opacity="0.5"/>
<text x="500" y="46" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="15" letter-spacing="9" fill="#00d4ff" opacity="0.9">SECTION 05
<animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></text>
