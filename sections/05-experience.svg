<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="HANDS-ON EXPERIENCE" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0a1020"/>
<stop offset="55%" stop-color="#112a4a"><animate attributeName="stop-color" values="#112a4a;#0f1f3a;#112a4a" dur="9s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#0a1020"/>
</linearGradient>
<linearGradient id="tt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
