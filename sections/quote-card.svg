<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#1b1148">
        <animate attributeName="stop-color" values="#1b1148;#0e2d52;#1b1148" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="996" height="216" rx="20" fill="url(#card)"/>

  <!-- animated glowing border -->
  <rect x="2" y="2" width="996" height="216" rx="20" fill="none" stroke="url(#border)" stroke-width="2"
        stroke-dasharray="140 60">
    <animate attributeName="stroke-dashoffset" values="0;-200" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- floating particles -->
  <g fill="#00d4ff">
    <circle cx="70" cy="180" r="3" opacity="0.6">
      <animate attributeName="cy" values="190;30;190" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="190" r="2" opacity="0.5">
      <animate attributeName="cy" values="200;40;200" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="195" r="2.5" opacity="0.5" fill="#8a2be2">
      <animate attributeName="cy" values="200;25;200" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="185" r="3" opacity="0.6" fill="#ff6b35">
      <animate attributeName="cy" values="195;35;195" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="190" r="2" opacity="0.5">
      <animate attributeName="cy" values="200;30;200" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- quote -->
  <text x="500" y="85" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="30" font-weight="bold" fill="url(#title)">
    "First, solve the problem. Then, write the code."
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="135" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="19" fill="#c9d1d9">
    Star my repos if you find them useful! Let's build something amazing together
  </text>

  <!-- blinking code tag -->
  <text x="500" y="182" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="17" fill="#00d4ff">
    &lt; coded with passion by Gunasekaran C /&gt;
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
